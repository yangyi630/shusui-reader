<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书髓 - 跨平台阅读精华聚合</title>
    <meta name="description" content="读过的每一本书，让精华不再被遗忘。跨平台阅读精华聚合 + AI 学习助手">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="书髓">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #faf8f5;
            color: #2d2a26;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .landing {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .logo {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #c8956c, #a67548);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 1.1rem;
            color: #6b6560;
            margin-bottom: 2.5rem;
            font-family: Georgia, "Noto Serif SC", serif;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .feature {
            background: white;
            border-radius: 12px;
            padding: 1.25rem 1rem;
            box-shadow: 0 2px 12px rgba(200,149,108,0.1);
            transition: all 0.3s ease;
        }
        .feature:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 20px rgba(200,149,108,0.2);
        }
        .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .feature-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; }
        .feature-desc { font-size: 0.8rem; color: #6b6560; line-height: 1.5; }
        .enter-btn {
            display: inline-block;
            padding: 1rem 3rem;
            background: linear-gradient(135deg, #c8956c, #a67548);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(200,149,108,0.3);
        }
        .enter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(200,149,108,0.4);
        }
        .footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #999;
        }
        .links {
            margin-top: 1rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            font-size: 0.85rem;
        }
        .links a {
            color: #c8956c;
            text-decoration: none;
        }
        @media (max-width: 480px) {
            .features { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="landing">
        <div class="logo">📖</div>
        <h1>书髓</h1>
        <p class="tagline">读过的每一本书，让精华不再被遗忘</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔗</div>
                <div class="feature-title">跨平台聚合</div>
                <div class="feature-desc">微信读书、番茄、Kindle、豆瓣 一站管理</div>
            </div>
            <div class="feature">
                <div class="feature-icon">✨</div>
                <div class="feature-title">精华提炼</div>
                <div class="feature-desc">智能提取划线金句，分类标签管理</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🧠</div>
                <div class="feature-title">AI 学习助手</div>
                <div class="feature-desc">文档分析、重点提取、学习规划</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-title">手机即用</div>
                <div class="feature-desc">PWA 离线使用，扫码即可安装</div>
            </div>
        </div>

        <a href="/app.html" class="enter-btn">开始使用 →</a>

        <div class="links">
            <a href="/demo.html">产品展示</a>
            <a href="/app.html">进入应用</a>
        </div>

        <div class="footer">
            © 2024 书髓 · 让阅读更有价值
        </div>
    </div>
</body>
</html>
